spring.application.name=document-service
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

server.port=8080

# Azure AD JWT issuer (set via environment variable from Key Vault)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}

# Platform JWT validation (set via environment variable from Key Vault)
app.jwt.secret=${JWT_SECRET}

# SharePoint / Microsoft Graph (set via environment variables from Key Vault)
sharepoint.tenant-id=${SHAREPOINT_TENANT_ID}
sharepoint.client-id=${SHAREPOINT_CLIENT_ID}
sharepoint.client-secret=${SHAREPOINT_CLIENT_SECRET}
sharepoint.host=${SHAREPOINT_HOST}
sharepoint.site-name=${SHAREPOINT_SITE_NAME}

# Log to shared volume (read by Filebeat sidecar)
logging.file.name=${LOGGING_FILE_NAME:/var/log/app/document-service.log}

# PostgreSQL datasource (set via environment variables from Key Vault)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.docker.compose.enabled=false
